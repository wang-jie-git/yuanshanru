<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- v4: 几何极简——三角形山抽象，山谷=V，锋利现代 -->
  <rect width="400" height="300" fill="#FAF9F6"/>
  <!-- 左山（高） -->
  <polygon points="40,270 185,60 205,270" fill="#5A5A6E"/>
  <!-- 右山（低） -->
  <polygon points="200,270 270,130 360,270" fill="#5A5A6E"/>
  <!-- 印章 -->
  <rect x="318" y="24" width="42" height="42" rx="4" fill="#B5443A"/>
  <text x="339" y="51" font-family="serif" font-size="20" fill="#FAF9F6" text-anchor="middle">得体</text>
</svg>
