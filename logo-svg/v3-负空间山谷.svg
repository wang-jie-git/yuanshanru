<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- v3: 负空间山谷——两山实心，中间山谷挖空成衣领V（最抽象） -->
  <rect width="400" height="300" fill="#FAF9F6"/>
  <!-- 整体山形用一坨黛色，中间用纸色挖出衣领V -->
  <path d="M40,270 C110,270 150,180 175,90 C200,180 215,240 240,270
           C265,240 290,180 310,150 C330,210 345,250 360,270 Z" fill="#5A5A6E"/>
  <!-- 挖出的衣领V（纸色） -->
  <path d="M175,90 C195,150 200,180 220,180 C240,180 245,150 255,110
           C240,175 230,220 222,270 L208,270 C200,220 190,170 175,90 Z" fill="#FAF9F6"/>
  <!-- 印章 -->
  <rect x="318" y="24" width="42" height="42" rx="4" fill="#B5443A"/>
  <text x="339" y="51" font-family="serif" font-size="20" fill="#FAF9F6" text-anchor="middle">得体</text>
</svg>
